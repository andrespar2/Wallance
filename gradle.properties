# Propiedades de compilación de Wallance.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=800m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Se usa KSP para Room y Hilt (más rápido que kapt).
# KSP2 se mantiene desactivado: Room/Hilt aún no son estables con él.
ksp.useKSP2=false
